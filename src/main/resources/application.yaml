spring:
  security:
    oauth2:
      authorizationserver:
        client:
          pkce:
            registration:
              client-id: pkce-client
              client-secret: "{noop}secret"
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - authorization_code
              redirect-uris:
                - http://127.0.0.1/callback
            require-proof-key: true
